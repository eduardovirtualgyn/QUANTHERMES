name: offline-tests

on:
  push:
  pull_request:

jobs:
  windows:
    name: pytest offline (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies without a live terminal
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip uninstall -y MetaTrader5
        shell: pwsh

      - name: Offline suite
        env:
          HERMES_OPERATOR_TOKEN: operator-token-ci-value
          HERMES_EXECUTION_MODE: paper
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q --tb=line
        shell: pwsh
