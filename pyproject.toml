[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-hermes"
version = "0.1.0"
description = "Autonomous Multi-Agent Quantitative Trading System for MetaTrader 5"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
authors = [
    { name = "Equipe de Engenharia Quant Hermes" }
]
keywords = [
    "quantitative-trading",
    "metatrader5",
    "multi-agent",
    "algorithmic-trading",
    "risk-management",
    "forex",
    "gold"
]
dependencies = [
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "fastapi>=0.111.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "numpy>=1.26.4,<2.0.0",
    "pandas>=2.2.2,<3.0.0",
    "polars>=1.6.0,<2.0.0",
    "scipy>=1.13.0,<2.0.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "xgboost>=2.1.0,<3.0.0",
    "lightgbm>=4.5.0,<5.0.0",
    "hmmlearn>=0.3.2,<1.0.0",
    "structlog>=24.2.0,<26.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "httpx>=0.27.0,<1.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "duckdb>=1.0.0,<2.0.0",
    "sqlalchemy>=2.0.30,<3.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "redis>=5.0.6,<6.0.0",
    "orjson>=3.10.0,<4.0.0",
    "MetaTrader5>=5.0.4200; sys_platform == 'win32'"
]

[project.optional-dependencies]
ai = [
    "langgraph>=0.2.0,<1.0.0",
    "langchain-core>=0.3.0,<1.0.0",
    "langchain-openai>=0.2.0,<1.0.0",
    "langchain-anthropic>=0.2.0,<1.0.0",
    "langchain-google-genai>=2.0.0,<3.0.0"
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0"
]

[tool.setuptools.packages.find]
include = [
    "core*",
    "data*",
    "deploy*",
    "execution*",
    "intelligence*",
    "monitoring*",
    "portfolio*",
    "risk*",
    "strategies*",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --strict-markers"
