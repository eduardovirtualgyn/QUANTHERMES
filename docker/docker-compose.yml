version: '3.8'

# ==============================================================================
# QUANT HERMES — ORQUESTRAÇÃO DE PRODUÇÃO EM DOCKER COMPOSE
# ==============================================================================
services:
  hermes-brain:
    build:
      context: ..
      dockerfile: docker/Dockerfile.brain
    image: hermes-quant/brain:1.0.0
    container_name: hermes-quant-brain
    restart: unless-stopped
    env_file:
      - ../.env.production
    environment:
      - HERMES_ENV=production
      - HERMES_OPERATOR_TOKEN=${HERMES_OPERATOR_TOKEN:?HERMES_OPERATOR_TOKEN is required}
      - HERMES_GATEWAY_URL=${HERMES_GATEWAY_URL:-http://host.docker.internal:8001}
      - HERMES_GATEWAY_TOKEN=${HERMES_GATEWAY_TOKEN:?HERMES_GATEWAY_TOKEN is required}
      - HERMES_BRIDGE_TOKEN=${HERMES_BRIDGE_TOKEN:?HERMES_BRIDGE_TOKEN is required}
    ports:
      # Só localhost. Acesso remoto: reverse proxy (TLS) ou VPN, nunca 0.0.0.0.
      - "127.0.0.1:8000:8000"
    volumes:
      - hermes_data_storage:/app/data/storage
      - hermes_data_parquet:/app/data/parquet
      - hermes_logs:/app/logs
    networks:
      - hermes-internal-net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # O gateway MT5 não é um serviço deste compose Linux.
  # No host Windows, com HERMES_BRIDGE_TOKEN definido:
  #   uvicorn execution.windows_gateway_asgi:app --host 127.0.0.1 --port 8001
  # Acesso remoto ao 8000/8001: reverse proxy com TLS ou VPN. Não publicar em 0.0.0.0.

volumes:
  hermes_data_storage:
    name: hermes_data_storage
  hermes_data_parquet:
    name: hermes_data_parquet
  hermes_logs:
    name: hermes_logs

networks:
  hermes-internal-net:
    name: hermes-internal-net
    driver: bridge

